# Git hooks. Based on agents/presets/hooks/assets/pre-commit-config.yaml.
#
# After a clone:
#
#   git config --local core.autocrlf false     # or mixed-line-ending loops forever
#   prek install
#   prek run --all-files                       # builds environments before first commit
#
# Verify the file is sane after editing:
#   prek run --hook-stage manual --all-files

minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
# ── CORE ──────────────────────────────────────────────────────────────────────

  - repo: meta
    hooks:
      - id: check-hooks-apply
        stages: [manual]
      - id: check-useless-excludes
        stages: [manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Fixes the file, then fails the commit. Run `git add` and commit again.
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      # Refuses only, changes nothing.
      - id: check-yaml
      - id: check-toml
      # No exclude: the preset skips biome.json as JSONC, but ours is strict JSON.
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: detect-private-key
      - id: forbid-submodules
      - id: destroyed-symlinks

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      # U+FFFD is what a botched encoding leaves behind.
      - id: text-unicode-replacement-char

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      # Fixes typos on its own. Its dictionary is English only, and the Polish
      # documents in this repo are all .md.
      - id: typos
        exclude: \.md$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --force-scope
          - --scopes=theme,userscript,tools,assets,docs,git,hooks,ci
          - feat
          - fix
          - chore
          - docs
          - refactor
          - test
          - perf
          - style
          - ci
          - build
          - revert

# OWN STANDARDS from MattyMroz/agents is deliberately absent. const-docstrings
# guards docstrings on module-level constants; tools/update_classes.py declares
# none, so it never had anything to check here. It also broke CI outright: the
# agents repo is private, so a runner cannot clone it without a token, and the
# server-side gate is the one layer --no-verify cannot skip. Re-add it if that
# repo turns public and this one grows module-level constants.

# ── MARKDOWN ──────────────────────────────────────────────────────────────────

  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        args: [--number]
        # Without these plugins it wrecks GFM tables.
        additional_dependencies:
          - mdformat-gfm==0.4.1
          - mdformat-tables==1.0.0
          - mdformat-frontmatter==2.0.8

# ── PYTHON ────────────────────────────────────────────────────────────────────

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        stages: [pre-push]

# ── FRONTEND ──────────────────────────────────────────────────────────────────
# The only gate covering the 730-line theme. biome.json turns off three rules
# that are wrong for a theme overriding someone else's stylesheet: !important is
# required here, and rule order is load-bearing so specificity may descend.

  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.7
    hooks:
      - id: biome-check

# ── ASCII-ONLY ────────────────────────────────────────────────────────────────
# pygrep compiles the pattern as bytes, so a byte range is used instead of a
# character class.
#
# Scoped to source by extension rather than `types: [text]` plus a long exclude.
# The broad form fails on the box-drawing separators inside .gitignore and this
# very file, and on the author's name in LICENSE - none of which is source. What
# this guards is real: a Polish CSS comment shipped in the theme until 1.2.7.

  - repo: local
    hooks:
      - id: ascii-only
        name: source must be ASCII
        entry: '[^\x00-\x7F]'
        language: pygrep
        files: \.(css|js|py)$
