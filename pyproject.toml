[project]
name = "obsidian-discord"
version = "1.2.7"
description = "Obsidian theme for Discord - maintenance tooling for the CSS class hashes"
requires-python = ">=3.14"
dependencies = []

# The repository ships a CSS theme, not a Python package. scripts/ holds maintenance
# scripts run directly, so there is nothing to build or install.
[tool.uv]
package = false

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.16"]

[tool.mypy]
strict = true
files = ["scripts"]

# Discord's CSS Modules class names are a word plus a hex hash, and the hex reads
# as misspelled English: container_abd9a8 gets flagged because of the abd. The
# names are not ours to rename, so the shape is ignored wholesale.
[tool.typos.default]
extend-ignore-identifiers-re = ["[A-Za-z]+_{1,2}[0-9a-f]{5,6}"]
