name: CI

# Local hooks can be skipped with --no-verify and a fresh clone has none
# installed until `prek install`. On GitHub.com this is the only layer that
# cannot be bypassed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Exact tag: the author publishes no moving v3, only v3.0.0.
      - uses: j178/prek-action@v3.0.0
        with:
          extra-args: --all-files

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # mypy is a pre-push hook, so `prek run --all-files` above never reaches
      # it. Without this job nothing type-checks the maintenance script in CI.
      - name: mypy
        run: uv run mypy

  single_stylesheet:
    name: One stylesheet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # This project shipped three stylesheets at once: the theme, a one-line
      # @import alias, and a generated 650 KB bundle. Two of them were copies of
      # the third in some form, an earlier pair drifted apart and served different
      # styling to BetterDiscord and browser users for months, and nobody could
      # tell from the repository which file was authoritative.
      #
      # There is one now, and this is what keeps it that way. The browser bundle
      # is built by the Pages workflow and published from there, never committed.
      - name: The repository tracks exactly one stylesheet
        run: |
          tracked=$(git ls-files '*.css')
          count=$(printf '%s\n' "$tracked" | grep -c . || true)

          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 tracked .css file, found $count:"
            printf '%s\n' "$tracked"
            exit 1
          fi

          # BetterDiscord only loads files matching *.theme.css from its themes
          # directory, so the one file has to be installable as it stands.
          case "$tracked" in
            ObsidianDiscord.theme.css) ;;
            *)
              echo "::error::the tracked stylesheet is '$tracked'"
              echo "::error::it must be ObsidianDiscord.theme.css - BetterDiscord loads *.theme.css only"
              exit 1
              ;;
          esac

          echo "single stylesheet: $tracked"

  bundle:
    name: Browser bundle
    runs-on: ubuntu-latest
    # On main the Pages workflow builds and publishes the same bundle, so
    # building it twice per push would only double the load on the hosts it
    # fetches from. Pull requests have no deploy, which is exactly where an
    # unbuildable bundle would otherwise go unnoticed until it was merged.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The script carries its own guards - size, no @import, no capnkitten URL,
      # exactly one copy of this theme in it - and exits non-zero when one fails.
      - name: Build refuses to produce a bundle a browser would reject
        run: uv run --no-dev python scripts/build_browser_css.py
