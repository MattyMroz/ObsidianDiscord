name: Pages

# The browser bundle is built here instead of being committed.
#
# It is 650 KB of machine output: Material Discord inlined, icons turned into
# data: URIs, fonts repointed at gstatic. Keeping it in the repository meant the
# only hand-written stylesheet sat next to a generated near-copy of itself, and
# every theme change produced two diffs where one of them was noise nobody could
# read. Worse, the copy in git went stale the moment anyone forgot to rebuild.
#
# So Pages no longer serves the branch. This workflow builds the site, adds the
# freshly generated bundle to it, and deploys that - which means the published
# bundle is always built from the theme as it exists on main.

on:
  push:
    branches: [main]
  # Nothing in this repository has to change for the published file to go stale:
  # Material moves on CapnKitten's schedule and the class changelist on
  # SyndiShanX's. Rebuilding daily picks both up without anyone touching the repo,
  # which is the difference between a build that is current and one that was
  # current the last time somebody pushed.
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
  # Called by update-classes.yml after it commits a repair. A push made with
  # GITHUB_TOKEN does not start another workflow run, so that job cannot rely on
  # the push trigger above and calls this one directly.
  workflow_call:
    inputs:
      ref:
        description: Commit or branch to publish
        type: string
        required: false
        default: ""

concurrency:
  group: pages
  # Never cancel a deploy in flight; a half-finished one would take the live
  # stylesheet URLs down with it.
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      # The build refuses to write a bundle that would fail Discord's CSP or one
      # built from a theme other than this checkout, so the deploy below cannot
      # publish a broken stylesheet.
      - name: Build the browser bundle
        run: uv run --no-dev python scripts/build_browser_css.py

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Same Jekyll the branch-served site ran, so the rendered README stays at
      # the site root and every existing URL keeps resolving.
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: .
          destination: ./_site

      # The built file takes the place of the source copy Jekyll put there, so the
      # site publishes one stylesheet under one name - installable by hand in
      # BetterDiscord and fetchable by the userscript.
      #
      # sudo, because the Jekyll step above runs in a container as root and leaves
      # _site owned by root; a plain cp here fails with EACCES.
      - name: Publish the built stylesheet under the one public name
        run: |
          sudo cp dist/ObsidianDiscord.theme.css ./_site/ObsidianDiscord.theme.css
          ls -l ./_site/ObsidianDiscord.theme.css
          head -4 ./_site/ObsidianDiscord.theme.css

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  # A job of its own, not a last step of the build. deploy-pages looks the
  # artifact up through the API, and right after upload-pages-artifact finalizes
  # it that list can still be empty: three nightly runs in a row uploaded the
  # artifact and then failed with 'No artifacts named "github-pages" were found'.
  # This job starts only after the build job has finished, which is also the
  # layout of GitHub's own Pages workflow template.
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
