name: Discord class updates

# Discord rewrites its CSS class hashes on every client update, which silently
# kills selectors in the theme. SyndiShanX publishes the old -> new mappings, so
# this runs the repair daily and opens a pull request when the theme moved.

on:
  schedule:
    # Daily. Off the hour, because scheduled runs pile up on round times.
    - cron: "17 4 * * *"
  workflow_dispatch:

# The previous sync workflow in this repo failed for months on `git push`
# because it never declared these. Set them explicitly.
permissions:
  contents: write

concurrency:
  group: class-updates
  cancel-in-progress: false

jobs:
  update:
    name: Apply the changelist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # $RUNNER_TEMP, never the workspace: the changelist is a 3 MB file that
      # must not reach a commit, and keeping it outside the repo tree makes that
      # structural instead of a .gitignore rule someone can edit.
      - name: Fetch the changelist
        run: |
          curl -fsSL \
            -o "$RUNNER_TEMP/Changes.txt" \
            https://raw.githubusercontent.com/SyndiShanX/Update-Classes/main/Changes.txt
          wc -c <"$RUNNER_TEMP/Changes.txt"

      - name: Apply the class changes
        run: |
          uv run --no-dev python scripts/update_classes.py \
            "$RUNNER_TEMP/Changes.txt" \
            ObsidianDiscord.theme.css

      # A pull request would leave the theme broken until somebody noticed it,
      # which is the problem this workflow exists to remove. The changelist maps
      # one hashed class name onto another, so if Discord moved a hash the theme
      # has to move with it. These assertions stand in for the human: they fail
      # the run rather than commit something that changed more than class names.
      - name: Refuse a change that touches anything but class names
        run: |
          theme=ObsidianDiscord.theme.css

          if git diff --quiet -- "$theme"; then
            echo "Theme already matches the changelist."
            exit 0
          fi

          git show "HEAD:$theme" >"$RUNNER_TEMP/before.css"

          # The header carries @name, @version and the credits, and line 13 is the
          # Material Discord import the theme is built on. None of it is a class.
          for probe in '^@import' '@name' '@version' '@author' '@source' '@credit'; do
            if ! diff <(grep -- "$probe" "$RUNNER_TEMP/before.css") \
                      <(grep -- "$probe" "$theme") >/dev/null; then
              echo "::error file=$theme::a line matching '$probe' changed; refusing to commit"
              exit 1
            fi
          done

          # Renaming classes cannot add or remove a rule block.
          before=$(grep -c '{' "$RUNNER_TEMP/before.css")
          after=$(grep -c '{' "$theme")
          if [ "$before" -ne "$after" ]; then
            echo "::error file=$theme::rule blocks went from $before to $after; refusing to commit"
            exit 1
          fi

          echo "guard passed: $before rule blocks, header and imports untouched"

      - name: Commit the repair to main
        run: |
          theme=ObsidianDiscord.theme.css

          if git diff --quiet -- "$theme"; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only the theme is ever staged, so a stray file cannot ride along.
          git add -- "$theme"
          git commit -m "fix(theme): update Discord class hashes"
          git push origin HEAD:main
