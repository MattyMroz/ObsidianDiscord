name: Discord class updates

# Discord rewrites its CSS class hashes on every client update, which silently
# kills selectors in the theme. SyndiShanX publishes the old -> new mappings, so
# this runs the repair daily, rebuilds the browser bundle on top of it, and
# commits straight to main once both pass their guards.

on:
  schedule:
    # Daily. Off the hour, because scheduled runs pile up on round times.
    - cron: "17 4 * * *"
  workflow_dispatch:

# The previous sync workflow in this repo failed for months on `git push`
# because it never declared these. Set them explicitly.
permissions:
  contents: write

concurrency:
  group: class-updates
  cancel-in-progress: false

jobs:
  update:
    name: Apply the changelist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # $RUNNER_TEMP, never the workspace: the changelist is a 3 MB file that
      # must not reach a commit, and keeping it outside the repo tree makes that
      # structural instead of a .gitignore rule someone can edit.
      - name: Fetch the changelist
        run: |
          curl -fsSL \
            -o "$RUNNER_TEMP/Changes.txt" \
            https://raw.githubusercontent.com/SyndiShanX/Update-Classes/main/Changes.txt
          wc -c <"$RUNNER_TEMP/Changes.txt"

      - name: Apply the class changes
        run: |
          uv run --no-dev python scripts/update_classes.py \
            "$RUNNER_TEMP/Changes.txt" \
            ObsidianDiscord.theme.css

      # A pull request would leave the theme broken until somebody noticed it,
      # which is the problem this workflow exists to remove. The changelist maps
      # one hashed class name onto another, so if Discord moved a hash the theme
      # has to move with it. These assertions stand in for the human: they fail
      # the run rather than commit something that changed more than class names.
      - name: Refuse a change that touches anything but class names
        run: |
          theme=ObsidianDiscord.theme.css

          if git diff --quiet -- "$theme"; then
            echo "Theme already matches the changelist."
            exit 0
          fi

          git show "HEAD:$theme" >"$RUNNER_TEMP/before.css"

          # The header carries @name, @version and the credits, and line 13 is the
          # Material Discord import the theme is built on. None of it is a class.
          for probe in '^@import' '@name' '@version' '@author' '@source' '@credit'; do
            if ! diff <(grep -- "$probe" "$RUNNER_TEMP/before.css") \
                      <(grep -- "$probe" "$theme") >/dev/null; then
              echo "::error file=$theme::a line matching '$probe' changed; refusing to commit"
              exit 1
            fi
          done

          # Renaming classes cannot add or remove a rule block.
          before=$(grep -c '{' "$RUNNER_TEMP/before.css")
          after=$(grep -c '{' "$theme")
          if [ "$before" -ne "$after" ]; then
            echo "::error file=$theme::rule blocks went from $before to $after; refusing to commit"
            exit 1
          fi

          echo "guard passed: $before rule blocks, header and imports untouched"

      # The bundle carries a copy of the theme and a copy of Material, so a repair
      # that stops at the theme leaves every browser user on the broken selectors.
      # It is rebuilt unconditionally: Material is vendored in here, and it moves
      # on CapnKitten's schedule, not on ours. BetterDiscord users already track
      # those changes live through @import with no review at all, so the bundle is
      # only catching up to what they are served anyway.
      - name: Rebuild the browser bundle
        run: uv run --no-dev python scripts/build_browser_css.py

      - name: Refuse a bundle that would not survive Discord's CSP
        run: |
          bundle=ObsidianDiscordBrowser.css
          theme=ObsidianDiscord.theme.css

          size=$(wc -c <"$bundle")
          if [ "$size" -lt 400000 ]; then
            echo "::error file=$bundle::$size bytes, expected at least 400000"
            exit 1
          fi

          # The whole reason this file exists: nothing in it may need fetching.
          if grep -q '@import' "$bundle"; then
            echo "::error file=$bundle::an @import survived; the page would be blocked"
            exit 1
          fi
          if grep -Eq 'url\(\s*.?https://capnkitten' "$bundle"; then
            echo "::error file=$bundle::a capnkitten URL survived; img-src blocks it"
            exit 1
          fi

          # And it has to be this theme, not a stale copy of it.
          if [ "$(grep -c '^/\* ObsidianDiscord\.theme\.css \*/$' "$bundle")" -ne 1 ]; then
            echo "::error file=$bundle::the appended theme is missing or duplicated"
            exit 1
          fi
          version=$(grep -m1 '@version' "$theme")
          if ! grep -qF "$version" "$bundle"; then
            echo "::error file=$bundle::does not carry '$version' from the theme"
            exit 1
          fi

          echo "guard passed: $size bytes, no fetches, carries $version"

      - name: Commit the repair to main
        run: |
          theme=ObsidianDiscord.theme.css
          bundle=ObsidianDiscordBrowser.css

          if git diff --quiet -- "$theme" "$bundle"; then
            echo "Nothing moved."
            exit 0
          fi

          if git diff --quiet -- "$theme"; then
            message="chore(theme): rebuild the browser bundle"
          else
            message="fix(theme): update Discord class hashes"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only these two are ever staged, so a stray file cannot ride along.
          git add -- "$theme" "$bundle"
          git commit -m "$message"
          git push origin HEAD:main
